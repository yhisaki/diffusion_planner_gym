[project]
name = "diffusion-planner-gym"
version = "0.1.0"
description = "Gymnasium simulation environment for diffusion planner"
requires-python = ">=3.10"
dependencies = [
    "argcomplete",
    "casadi>=3.8.1",
    "diffusion-planner",
    "gymnasium>=1.4.0",
    "numpy>=2.2.6",
    "tqdm",
    "zstandard>=0.25.0",
]

[project.scripts]
diffusion-planner-gym = "diffusion_planner_gym.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["diffusion_planner", "diffusion_planner_gym"]

[tool.pyright]
include = ["src", "examples"]
pythonVersion = "3.10"
# ML-Planner's .venv; this repository is cloned into ML-Planner/packages/.
venvPath = "../.."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
